    <rect x="502" y="368" width="116" height="25" rx="12.5" fill="#dfeed2" stroke="#2c5a00" stroke-width="1.5"/>
    <text x="560" y="385" text-anchor="middle" fill="#1b4000" font-size="13" font-weight="800">2027 추진 예정</text>

