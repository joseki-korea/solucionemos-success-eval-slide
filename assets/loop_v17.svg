    <rect x="1028" y="373" width="66" height="20" rx="10" fill="#76b900"/>
    <text x="1061" y="387" text-anchor="middle" fill="#102200" font-size="11.5" font-weight="800">출발점 완료</text>
    <text x="858" y="391" fill="#ffffff" font-size="15.5" font-weight="800">로봇 공정 협약 완료</text>
    <text x="858" y="414" fill="#d9ecc9" font-size="13" font-weight="500">인더스트리 4.0 협회 ·</text>
    <text x="858" y="431" fill="#b8e968" font-size="13" font-weight="700">아이투비씨(현대로봇 출신) 협약</text>

    <rect x="1116" y="364" width="260" height="78" rx="10" fill="#ffffff" stroke="#2c5a00" stroke-width="1.8" stroke-dasharray="5 4"/>
    <rect x="1296" y="373" width="68" height="20" rx="10" fill="#dfeed2" stroke="#2c5a00" stroke-width="1.2"/>
    <text x="1330" y="387" text-anchor="middle" fill="#1b4000" font-size="11.5" font-weight="800">2027 계획</text>
    <text x="1130" y="391" fill="#16290e" font-size="15.5" font-weight="800">바이브 제어 · 실증</text>
    <text x="1130" y="414" fill="#374a30" font-size="13" font-weight="600">멀티 에이전틱 공장 R&amp;D ·</text>
    <text x="1130" y="431" fill="#2c5a00" font-size="13" font-weight="700">2027 로봇 공정 실증 추진 예정</text>
  </g>

  <!-- Vertical Dotted Signal Arrow between Layer 3 & Layer 4 -->
