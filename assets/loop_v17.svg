    <text x="434" y="547" fill="#d9ecc9" font-size="13.5" font-weight="500">작업자 위생 판독 모델 · 한글 점검 문서 OCR 가중치·완료보고서 확보</text>

    <rect x="892" y="496" width="484" height="66" rx="10" fill="#f1f7eb" stroke="#2c5a00" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="1270" y="505" width="92" height="20" rx="10" fill="#dfeed2" stroke="#2c5a00" stroke-width="1.2"/>
    <text x="1316" y="519" text-anchor="middle" fill="#1b4000" font-size="11.5" font-weight="800">2027 예정</text>
    <text x="910" y="523" fill="#16290e" font-size="16.5" font-weight="800">자율 재학습 순환 실증</text>
    <text x="910" y="547" fill="#2c5a00" font-size="13.5" font-weight="700">현장 결과 데이터로 모델을 스스로 다시 학습해 상위 계층에 배포 (지향점)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT-SIDE CLOSED-LOOP RETURN HIGHWAY (자율 학습 -> 센서 관제 · 경영)   -->
  <!-- ===================================================================== -->
  <g id="return-loop-highway">
    <path id="flow4-track" d="M 1392 529 C 1546 529, 1546 268, 1398 268" stroke="#76b900" stroke-opacity="0.22" stroke-width="9" stroke-linecap="round"/>
    <path id="flow4" d="M 1392 529 C 1546 529, 1546 268, 1398 268" stroke="#5a9600" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 12" marker-end="url(#arrow-up)"/>

    <path id="flow5-track" d="M 1508 360 C 1548 250, 1538 135, 1398 135" stroke="#76b900" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>
    <path id="flow5" d="M 1508 360 C 1548 250, 1538 135, 1398 135" stroke="#76b900" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12" marker-end="url(#arrow-up)"/>

    <rect x="1416" y="300" width="152" height="70" rx="12" fill="#13220c" stroke="#76b900" stroke-width="2"/>
