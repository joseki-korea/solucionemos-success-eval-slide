    <text x="112" y="283" fill="#e8f5dc" font-size="15" font-weight="600">솔루시오네모스 AI Agentic 키오스크 (350×250×100mm 본체 · Jetson Orin 탑재 · 열화상·영상·온습도 센서 결합)</text>
    <text x="112" y="306" fill="#b8e968" font-size="13.8" font-weight="700">외부 인터넷 없이 로컬 LLM이 HACCP 기준 안내 · 작업자 확인·기록 · 충주 식품 제조 현장 시제품 설치·태블릿 실증 완료</text>

    <g id="layer2-evidence">
      <rect x="1008" y="230" width="178" height="34" rx="8" fill="#173500" stroke="#76b900" stroke-width="1.4"/>
      <text x="1097" y="252" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Jetson Orin · 로컬 LLM</text>

      <rect x="1196" y="230" width="180" height="34" rx="8" fill="#173500" stroke="#76b900" stroke-width="1.4"/>
      <text x="1286" y="252" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">센서 대시보드 · 현장 실증</text>

      <rect x="1008" y="272" width="368" height="34" rx="8" fill="#2f6300" stroke="#9be12b" stroke-width="1.4"/>
      <text x="1192" y="294" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">위생복·위생모 YOLO · 점검 문서 OCR 위탁개발 2건 완료</text>
    </g>
  </g>

