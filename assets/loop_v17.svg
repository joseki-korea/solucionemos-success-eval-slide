<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="none" fill="none" font-family="Paperlogy, 'Malgun Gothic', sans-serif">
  <style>#flow1,#flow1b,#flow2,#flow2b,#flow3,#flow4,#flow5 {animation:signal 2s linear infinite} @keyframes signal {to {stroke-dashoffset:-26}} @media (prefers-reduced-motion:reduce) {#flow1,#flow1b,#flow2,#flow2b,#flow3,#flow4,#flow5 {animation:none}} @media print {#flow1,#flow1b,#flow2,#flow2b,#flow3,#flow4,#flow5 {animation:none}}</style><defs>
    <marker id="arrow-down" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 1 1.5 L 10 6 L 1 10.5 Z" fill="#5a9600"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 1 1.5 L 10 6 L 1 10.5 Z" fill="#76b900"/>
    </marker>
  </defs>

  <!-- ===================================================================== -->
  <!-- OUTER UMBRELLA FRAME: 0. 멀티 에이전틱 (Multi-Agentic 자율 진화 공장)    -->
  <!-- ===================================================================== -->
  <rect x="20" y="12" width="1560" height="576" rx="20" fill="#4a7c10" fill-opacity="0.04" stroke="#5a9600" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Top Umbrella Header Bar + 2-Box Status Legend -->
  <g id="umbrella-header">
    <rect x="44" y="26" width="576" height="44" rx="10" fill="#13220c" stroke="#76b900" stroke-width="2"/>
    <g transform="translate(62, 35)" stroke="#9be12b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="4"/>
      <circle cx="24" cy="8" r="4"/>
      <circle cx="16" cy="21" r="4"/>
      <path d="M 12 8 H 20 M 10 11.5 L 14 17.5 M 22 11.5 L 18 17.5"/>
    </g>
    <text x="102" y="55" fill="#9be12b" font-size="22" font-weight="800">멀티 에이전틱</text>
    <text x="256" y="54" fill="#ffffff" font-size="16.5" font-weight="600">— 협업으로 만드는 자율 진화 공장</text>

    <!-- Legend 2 cells (완료 / 2027 추진 예정) -->
    <rect x="1116" y="28" width="198" height="40" rx="8" fill="#234d00" stroke="#76b900" stroke-width="1.6"/>
    <circle cx="1138" cy="48" r="6" fill="#9be12b"/>
    <text x="1154" y="54" fill="#ffffff" font-size="15.5" font-weight="700">완료 (협약기간 실적)</text>

    <rect x="1326" y="28" width="230" height="40" rx="8" fill="#f1f7eb" stroke="#2c5a00" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="1348" cy="48" r="6" fill="none" stroke="#2c5a00" stroke-width="2.2" stroke-dasharray="3 2"/>
    <text x="1364" y="54" fill="#1d3b00" font-size="15.5" font-weight="700">2027 추진 예정 (지향점)</text>
  </g>

  <!-- ===================================================================== -->
  <!-- LAYER 1 (y=84..186): ERP·MES 너머 — 경영 에이전트 (추진 예정)           -->
  <!-- ===================================================================== -->
  <g id="layer-1-erp-mes">
    <rect x="44" y="84" width="1348" height="102" rx="14" fill="#f1f7eb" stroke="#2c5a00" stroke-width="2.4" stroke-dasharray="8 5"/>

    <g transform="translate(66, 106)" stroke="#2c5a00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="32" height="26" rx="4"/>
      <path d="M 9 13 H 27 M 9 21 H 21"/>
    </g>
    <text x="112" y="123" fill="#2c5a00" font-size="23" font-weight="800">ERP·MES 너머 — 경영 에이전트</text>
    <rect x="458" y="102" width="116" height="25" rx="12.5" fill="#dfeed2" stroke="#2c5a00" stroke-width="1.5"/>
    <text x="516" y="119" text-anchor="middle" fill="#1b4000" font-size="13" font-weight="800">2027 추진 예정</text>

    <text x="112" y="152" fill="#182612" font-size="15.5" font-weight="600">ERP·MES를 넘어, 계획이 현장 실행으로 이어지는 경영 (기록·조회에서 멈추지 않고 에이전트가 조율)</text>
    <text x="112" y="173" fill="#3c5431" font-size="13.5" font-weight="700">출발 기반(완료): 멀티 에이전트 기반 에이전틱 경영·제조·품질 시스템 고객사 확보</text>

    <g id="layer1-agent-chips">
      <line x1="932" y1="120" x2="1280" y2="120" stroke="#4f8500" stroke-width="1.8" stroke-dasharray="3 4"/>
      <line x1="932" y1="156" x2="1280" y2="156" stroke="#4f8500" stroke-width="1.8" stroke-dasharray="3 4"/>

      <rect x="872" y="102" width="96" height="32" rx="8" fill="#ffffff" stroke="#2c5a00" stroke-width="1.8"/>
      <text x="920" y="123" text-anchor="middle" fill="#183600" font-size="14" font-weight="800">생산 에이전트</text>

      <rect x="980" y="102" width="96" height="32" rx="8" fill="#ffffff" stroke="#2c5a00" stroke-width="1.8"/>
      <text x="1028" y="123" text-anchor="middle" fill="#183600" font-size="14" font-weight="800">품질 에이전트</text>

      <rect x="1088" y="102" width="96" height="32" rx="8" fill="#ffffff" stroke="#2c5a00" stroke-width="1.8"/>
      <text x="1136" y="123" text-anchor="middle" fill="#183600" font-size="14" font-weight="800">자재 에이전트</text>

      <rect x="1196" y="102" width="96" height="32" rx="8" fill="#ffffff" stroke="#2c5a00" stroke-width="1.8"/>
      <text x="1244" y="123" text-anchor="middle" fill="#183600" font-size="14" font-weight="800">경영 에이전트</text>

      <rect x="936" y="142" width="292" height="28" rx="14" fill="#2c5a00"/>
      <text x="1082" y="161" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">수주 · 자재 · 공정 계획 ↔ 현장 작업 지시</text>

      <rect x="1304" y="102" width="72" height="68" rx="10" fill="#234d00" stroke="#76b900" stroke-width="1.5"/>
      <text x="1340" y="125" text-anchor="middle" fill="#9be12b" font-size="12" font-weight="800">기반 완료</text>
      <text x="1340" y="144" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">시스템</text>
      <text x="1340" y="161" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">고객 확보</text>
    </g>
  </g>

  <!-- Vertical Bi-directional Dotted Signal Arrows between Layer 1 & Layer 2 -->
  <g id="signals-1-2">
    <path id="flow1" d="M 520 186 L 520 210" stroke="#5a9600" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="1 9" marker-end="url(#arrow-down)"/>
    <text x="534" y="204" fill="#538d00" font-size="12.5" font-weight="700">계획·기준 하달</text>
    <path id="flow1b" d="M 880 212 L 880 188" stroke="#76b900" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="1 9" marker-end="url(#arrow-up)"/>
    <text x="894" y="204" fill="#538d00" font-size="12.5" font-weight="700">이상·점검 보고</text>
  </g>

