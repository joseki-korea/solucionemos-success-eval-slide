    <text x="112" y="420" fill="#182612" font-size="16" font-weight="700">말로 지시하면 에이전트가 로봇·PLC 제어로 옮기는 바이브 제어</text>
    <text x="112" y="441" fill="#3c5431" font-size="13.5" font-weight="600">로봇 자동화 설비 실증·도입 MoU 5건(공급계약 전) 기반 후속 공정 실증 연계</text>

    <!-- Right Split Sub-boxes: 출발점 완료 vs 2027 계획 (zero pill overlap) -->
